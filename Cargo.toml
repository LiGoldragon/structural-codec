[package]
name         = "structural-codec"
version      = "0.6.0"
autotests    = false
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/structural-codec"
description  = "The Core-associated, bidirectional, revisioned structural-form kernel: a trusted runtime evaluator over data-loadable dialect tables, governed by conformance laws."
publish      = false

[lib]
name = "structural_codec"
path = "src/lib.rs"

[[test]]
name = "downstream_authoring"
path = "tests/downstream_authoring.rs"

[dependencies]
content-identity = { git = "https://github.com/LiGoldragon/content-identity.git", rev = "24b43bae5d9748b0e7f679c6ec9f85a643c4d36a" }
name-table       = { git = "https://github.com/LiGoldragon/name-table.git", rev = "196610e2907687dcb8dbd0d2dfaafe4aefd9fa27" }
raw-discovery    = { git = "file:///git/github.com/LiGoldragon/raw-discovery", rev = "283c865a43d2bdde75250588de4f9bc78061cdfa" }
rkyv             = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror        = "2"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
